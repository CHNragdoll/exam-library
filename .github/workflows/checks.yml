name: Offline library checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: python scripts/verify_library.py --tracked
      - run: python scripts/verify_structured_exams.py
      - run: python scripts/check_public_english_translations.py
      - run: python scripts/build_question_database.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s . -p 'test_*.py'
        working-directory: data/sources/english-exams-reflow-latex
        env:
          PYTHONPATH: ${{ github.workspace }}
      - run: npm test
      - run: python data/sources/math3-latex-1987-2009/test_option_layout.py
